<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Dropix</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 50% -10%, #6028b5 0%, transparent 38%),
        #08080c;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 18px;
    padding-bottom: 95px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.logo {
    font-size: 29px;
    font-weight: 900;
    letter-spacing: 2px;
}

.logo span {
    color: #a15cff;
}

.profile {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg,#8c48ff,#d34cff);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
}

.balance {
    background: linear-gradient(135deg,#17121f,#241631);
    border: 1px solid #352344;
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 25px;
}

.balance-title {
    color: #999;
    font-size: 13px;
}

.stars {
    font-size: 25px;
    font-weight: 900;
    margin-top: 4px;
}

.virtual {
    color: #8d7a9d;
    font-size: 11px;
    margin-top: 4px;
}

.section-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 14px;
}

.cases {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.case {
    background: linear-gradient(145deg,#19151f,#0f0e13);
    border: 1px solid #30243d;
    border-radius: 20px;
    padding: 16px;
    text-align: center;
}

.case-icon {
    font-size: 62px;
    margin: 10px;
}

.case-name {
    font-weight: 800;
    font-size: 17px;
}

.case-reward {
    color: #aaa;
    font-size: 12px;
    margin: 6px 0;
}

.case button {
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 11px;
    background: #8b45ff;
    color: white;
    font-weight: bold;
    margin-top: 8px;
}

.case button:active {
    transform: scale(.97);
}

/* ЭКРАН КЕЙСА */

.case-screen {
    display: none;
}

.back {
    background: none;
    border: 0;
    color: white;
    font-size: 17px;
    padding: 5px 0;
    margin-bottom: 20px;
}

.big-case {
    text-align: center;
}

.big-case-icon {
    font-size: 95px;
    margin: 15px;
}

.case-description {
    color: #999;
    font-size: 13px;
}

/* РУЛЕТКА */

.roulette {
    display: none;
    margin-top: 25px;
    overflow: hidden;
    border-radius: 18px;
    border: 1px solid #342544;
    background: #111017;
    height: 125px;
    position: relative;
}

.roulette-line {
    display: flex;
    align-items: center;
    height: 100%;
    gap: 12px;
    position: absolute;
    left: 0;
    transition: transform 3.5s cubic-bezier(.12,.75,.18,1);
}

.item {
    min-width: 105px;
    height: 100px;
    border-radius: 15px;
    background: #1d1824;
    border: 1px solid #3b2d48;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.item-icon {
    font-size: 35px;
}

.item-value {
    color: #b46cff;
    font-size: 15px;
    font-weight: 800;
    margin-top: 5px;
}

.pointer {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #b35cff;
    box-shadow: 0 0 18px #b35cff;
    z-index: 3;
}

/* КНОПКА */

.open-button {
    width: 100%;
    border: 0;
    border-radius: 15px;
    padding: 17px;
    background: linear-gradient(135deg,#8b45ff,#b44cff);
    color: white;
    font-size: 17px;
    font-weight: 900;
    margin-top: 25px;
}

/* РЕЗУЛЬТАТ */

.result {
    display: none;
    text-align: center;
    margin-top: 25px;
}

.result-icon {
    font-size: 95px;
    animation: pop .5s ease;
}

.result-title {
    font-size: 25px;
    font-weight: 900;
    margin-top: 10px;
}

.result-value {
    color: #b26aff;
    font-size: 25px;
    font-weight: 900;
    margin-top: 8px;
}

@keyframes pop {
    0% {
        transform: scale(.3);
        opacity: 0;
    }
    80% {
        transform: scale(1.15);
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* НИЖНЕЕ МЕНЮ */

.nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: rgba(12,12,17,.96);
    border-top: 1px solid #24222a;
    display: flex;
    justify-content: center;
}

.nav-inner {
    width: 100%;
    max-width: 500px;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.nav button {
    background: none;
    border: 0;
    color: #777;
    font-size: 11px;
}

.nav button div {
    font-size: 23px;
    margin-bottom: 2px;
}

.nav .active {
    color: #a15cff;
}

/* ИСТОРИЯ */

.history {
    margin-top: 25px;
}

.history-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 10px;
}

.history-item {
    background: #15131a;
    border: 1px solid #29232f;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
}

.history-item span:last-child {
    color: #a95cff;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <!-- ГЛАВНАЯ -->

    <div id="home">

        <div class="header">
            <div class="logo">
                DROP<span>IX</span>
            </div>

            <div class="profile">
                👤
            </div>
        </div>

        <div class="balance">

            <div class="balance-title">
                Виртуальный баланс
            </div>

            <div class="stars" id="balance">
                ⭐ 0
            </div>

            <div class="virtual">
                Учебные игровые очки
            </div>

        </div>

        <div class="section-title">
            🎁 Кейсы
        </div>

        <div class="cases">

            <div class="case">

                <div class="case-icon">
                    🎁
                </div>

                <div class="case-name">
                    Free Case
                </div>

                <div class="case-reward">
                    Награда: 1–5 ⭐
                </div>

                <button onclick="selectCase('Free Case','🎁',1,5)">
                    БЕСПЛАТНО
                </button>

            </div>


            <div class="case">

                <div class="case-icon">
                    💜
                </div>

                <div class="case-name">
                    Purple Case
                </div>

                <div class="case-reward">
                    Награда: 10–40 ⭐
                </div>

                <button onclick="selectCase('Purple Case','💜',10,40)">
                    БЕСПЛАТНО
                </button>

            </div>


            <div class="case">

                <div class="case-icon">
                    💎
                </div>

                <div class="case-name">
                    Diamond Case
                </div>

                <div class="case-reward">
                    Награда: 50–150 ⭐
                </div>

                <button onclick="selectCase('Diamond Case','💎',50,150)">
                    БЕСПЛАТНО
                </button>

            </div>


            <div class="case">

                <div class="case-icon">
                    👑
                </div>

                <div class="case-name">
                    Royal Case
                </div>

                <div class="case-reward">
                    Награда: 200–300 ⭐
                </div>

                <button onclick="selectCase('Royal Case','👑',200,300)">
                    БЕСПЛАТНО
                </button>

            </div>

        </div>

        <div class="history">

            <div class="history-title">
                📜 История
            </div>

            <div id="historyList">
                <div style="color:#777;font-size:13px;">
                    Пока открытий нет
                </div>
            </div>

        </div>

    </div>


    <!-- ЭКРАН КЕЙСА -->

    <div id="caseScreen" class="case-screen">

        <button class="back" onclick="goHome()">
            ← Назад
        </button>

        <div class="big-case">

            <div class="big-case-icon" id="bigIcon">
                🎁
            </div>

            <h2 id="caseTitle">
                Free Case
            </h2>

            <div class="case-description" id="caseDescription">
                Награда: 1–5 ⭐
            </div>


            <div class="roulette" id="roulette">

                <div class="pointer"></div>

                <div class="roulette-line"
                     id="rouletteLine">
                </div>

            </div>


            <div class="result" id="result">

                <div class="result-icon">
                    🎉
                </div>

                <div class="result-title">
                    Поздравляем!
                </div>

                <div class="result-value"
                     id="resultValue">
                    +0 ⭐
                </div>

            </div>


            <button class="open-button"
                    id="openButton"
                    onclick="openCase()">

                🎁 ОТКРЫТЬ КЕЙС

            </button>

        </div>

    </div>

</div>


<!-- НИЖНЕЕ МЕНЮ -->

<div class="nav">

    <div class="nav-inner">

        <button class="active"
                onclick="goHome()">

            <div>🏠</div>
            Главная

        </button>

        <button onclick="goHome()">

            <div>🎁</div>
            Кейсы

        </button>

        <button>

            <div>🎒</div>
            Инвентарь

        </button>

        <button>

            <div>👤</div>
            Профиль

        </button>

    </div>

</div>


<script>

/* TELEGRAM */

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/* БАЛАНС */

let balance =
    Number(localStorage.getItem("dropix_balance")) || 0;


/* ИСТОРИЯ */

let history =
    JSON.parse(
        localStorage.getItem("dropix_history") || "[]"
    );


/* ВЫБРАННЫЙ КЕЙС */

let selectedCase = "";

let selectedIcon = "";

let minReward = 1;

let maxReward = 5;


/* ПОКАЗАТЬ БАЛАНС */

function updateBalance() {

    document.getElementById("balance").innerText =
        "⭐ " + balance;

}


/* СОХРАНИТЬ */

function saveData() {

    localStorage.setItem(
        "dropix_balance",
        balance
    );

    localStorage.setItem(
        "dropix_history",
        JSON.stringify(history)
    );

}


/* ВЫБОР КЕЙСА */

function selectCase(name, icon, min, max) {

    selectedCase = name;
    selectedIcon = icon;

    minReward = min;
    maxReward = max;


    document.getElementById("home")
        .style.display = "none";

    document.getElementById("caseScreen")
        .style.display = "block";


    document.getElementById("bigIcon")
        .innerText = icon;

    document.getElementById("caseTitle")
        .innerText = name;


    document.getElementById("caseDescription")
        .innerText =
        "Награда: " +
        min +
        "–" +
        max +
        " ⭐";


    document.getElementById("roulette")
        .style.display = "none";


    document.getElementById("result")
        .style.display = "none";


    const button =
        document.getElementById("openButton");

    button.style.display = "block";

    button.innerText =
        "🎁 ОТКРЫТЬ КЕЙС";

}


/* НАЗАД */

function goHome() {

    document.getElementById("caseScreen")
        .style.display = "none";

    document.getElementById("home")
        .style.display = "block";

}


/* СЛУЧАЙНОЕ ЧИСЛО */

function randomReward(min, max) {

    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;

}


/* ОТКРЫТИЕ */

function openCase() {

    const roulette =
        document.getElementById("roulette");

    const line =
        document.getElementById("rouletteLine");

    const button =
        document.getElementById("openButton");

    const result =
        document.getElementById("result");


    button.style.display = "none";

    result.style.display = "none";

    roulette.style.display = "block";


    line.innerHTML = "";

    /*
       Сначала определяем настоящий
       результат открытия.
    */

    const reward =
        randomReward(
            minReward,
            maxReward
        );


    /*
       Создаём предметы рулетки.
    */

    const totalItems = 35;

    const winningIndex = 28;


    for (let i = 0; i < totalItems; i++) {

        let value;

        if (i === winningIndex) {

            value = reward;

        } else {

            value =
                randomReward(
                    minReward,
                    maxReward
                );

        }


        const item =
            document.createElement("div");

        item.className = "item";

        item.innerHTML =
            '<div class="item-icon">' +
            '⭐' +
            '</div>' +
            '<div class="item-value">' +
            value +
            ' ⭐' +
            '</div>';

        line.appendChild(item);

    }


    /*
       Начальная позиция.
    */

    line.style.transform =
        "translateX(0px)";


    /*
       Запускаем рулетку.
    */

    setTimeout(() => {

        const itemWidth = 117;


        const position =
            -(winningIndex * itemWidth)
            + (window.innerWidth / 2)
            - (itemWidth / 2);


        line.style.transform =
            "translateX(" +
            position +
            "px)";

    }, 100);


    /*
       После анимации выдаём награду.
    */

    setTimeout(() => {

        balance += reward;

        history.unshift({
            case: selectedCase,
            reward: reward,
            time: new Date().toLocaleTimeString()
        });


        /*
           Оставляем последние 10 открытий.
        */

        history =
            history.slice(0, 10);


        saveData();

        updateBalance();

        showHistory();


        document.getElementById("resultValue")
            .innerText =
            "+" + reward + " ⭐";


        result.style.display =
            "block";


        button.innerText =
            "🎁 ОТКРЫТЬ ЕЩЁ";


        button.style.display =
            "block";


        if (
            tg.HapticFeedback &&
            tg.HapticFeedback.notificationOccurred
        ) {

            tg.HapticFeedback
                .notificationOccurred("success");

        }

    }, 3800);

}


/* ИСТОРИЯ */

function showHistory() {

    const list =
        document.getElementById("historyList");


    if (history.length === 0) {

        list.innerHTML =
            '<div style="color:#777;font-size:13px;">' +
            'Пока открытий нет' +
            '</div>';

        return;

    }


    list.innerHTML = "";


    history.forEach(item => {

        const element =
            document.createElement("div");

        element.className =
            "history-item";


        element.innerHTML =
            "<span>" +
            item.case +
            "</span>" +

            "<span>+" +
            item.reward +
            " ⭐</span>";


        list.appendChild(element);

    });

}


/* ЗАПУСК */

updateBalance();

showHistory();

</script>

</body>
</html>
