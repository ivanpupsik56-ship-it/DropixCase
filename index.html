<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Dropix</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 50% -10%, #5928a8 0%, transparent 38%),
        #08080c;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 18px;
    padding-bottom: 100px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.logo {
    font-size: 29px;
    font-weight: 900;
    letter-spacing: 2px;
}

.logo span {
    color: #a15cff;
}

.profile {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg,#8c48ff,#d34cff);
    display: flex;
    justify-content: center;
    align-items: center;
}

.balance {
    background: linear-gradient(135deg,#17121f,#241631);
    border: 1px solid #352344;
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 25px;
}

.balance-title {
    color: #999;
    font-size: 13px;
}

.stars {
    font-size: 23px;
    font-weight: 800;
    margin-top: 4px;
}

.section-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 14px;
}

.cases {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.case {
    background: linear-gradient(145deg,#19151f,#0f0e13);
    border: 1px solid #30243d;
    border-radius: 20px;
    padding: 16px;
    text-align: center;
}

.case-icon {
    font-size: 65px;
    margin: 10px;
}

.case-name {
    font-weight: 800;
    font-size: 17px;
}

.case-price {
    color: #aaa;
    font-size: 13px;
    margin: 5px;
}

.case button {
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 11px;
    background: #8b45ff;
    color: white;
    font-weight: bold;
    margin-top: 8px;
}

.free button {
    background: #20c98b;
}

/* ОКНО КЕЙСА */

.case-screen {
    display: none;
}

.back {
    background: none;
    border: 0;
    color: white;
    font-size: 17px;
    padding: 5px 0;
    margin-bottom: 20px;
}

.big-case {
    text-align: center;
}

.big-case-icon {
    font-size: 100px;
    margin: 20px;
}

.open-button {
    width: 100%;
    border: 0;
    border-radius: 15px;
    padding: 17px;
    background: linear-gradient(135deg,#8b45ff,#b44cff);
    color: white;
    font-size: 18px;
    font-weight: 900;
    margin-top: 25px;
}

/* АНИМАЦИЯ */

.roulette {
    display: none;
    margin-top: 25px;
    overflow: hidden;
    border-radius: 18px;
    border: 1px solid #342544;
    background: #111017;
    height: 130px;
    position: relative;
}

.roulette-line {
    display: flex;
    align-items: center;
    height: 100%;
    gap: 12px;
    position: absolute;
    left: 0;
    transition: transform 3.5s cubic-bezier(.12,.75,.18,1);
}

.item {
    min-width: 105px;
    height: 105px;
    border-radius: 15px;
    background: #1d1824;
    border: 1px solid #3b2d48;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 36px;
}

.item span {
    font-size: 11px;
    color: #aaa;
    margin-top: 5px;
}

.pointer {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #a95cff;
    box-shadow: 0 0 15px #a95cff;
    z-index: 3;
}

/* РЕЗУЛЬТАТ */

.result {
    display: none;
    text-align: center;
    margin-top: 25px;
}

.result-icon {
    font-size: 110px;
    animation: pop .5s ease;
}

.result-title {
    font-size: 25px;
    font-weight: 900;
    margin-top: 10px;
}

.result-name {
    color: #b26aff;
    margin-top: 5px;
}

@keyframes pop {
    0% { transform: scale(.3); }
    80% { transform: scale(1.15); }
    100% { transform: scale(1); }
}

}

.nav button div {
    font-size: 23px;
    margin-bottom: 2px;
}

.nav .active {
    color: #a15cff;
}
</style>
</head>

<body>

<div class="container">

    <div id="home">

        <div class="header">
            <div class="logo">DROP<span>IX</span></div>
            <div class="profile">👤</div>
        </div>

        <div class="balance">
            <div class="balance-title">Твой баланс</div>

            </div>

            <div class="case">

                <div class="case-price">25 ⭐</div>

                <button onclick="selectCase('Purple Case','💜')">
                    25 ⭐
                </button>
            </div>

            <div class="case">
                <div class="case-icon">💎</div>
                <div class="case-name">Diamond Case</div>
                <div class="case-price">100 ⭐</div>

                <button onclick="selectCase('Diamond Case','💎')">
                    100 ⭐
                </button>
            </div>

            <div class="case">
                <div class="case-icon">👑</div>
                <div class="case-name">Royal Case</div>
                <div class="case-price">250 ⭐</div>

                <button onclick="selectCase('Royal Case','👑')">
                    250 ⭐
                </button>
            </div>

        </div>

    </div>

    <div id="caseScreen" class="case-screen">

        <button class="back" onclick="goHome()">
            ← Назад
        </button>

        <div class="big-case">

            <div class="big-case-icon" id="bigIcon">

            </div>

            <h2 id="caseTitle">Free Case</h2>

            <div class="roulette" id="roulette">

                <div class="pointer"></div>

                <div class="roulette-line" id="rouletteLine"></div>

            </div>

            <div class="result" id="result">

                <div class="result-icon" id="resultIcon">
                    🎁
                </div>

                <div class="result-title">
                    🎉 Поздравляем!
                </div>

                <div class="result-name" id="resultName">
                    Подарок
                </div>

            </div>

            <button class="open-button"
                    id="openButton"
                    onclick="openCase()">
                🎁 ОТКРЫТЬ КЕЙС
            </button>

        </div>

    </div>

</div>

<div class="nav">

    <div class="nav-inner">

        <button class="active">
            <div>🏠</div>
            Главная
        </button>

        <button>
            <div>🎁</div>
            Кейсы
        </button>

        <button>
            <div>🎒</div>
            Инвентарь
        </button>

        <button>
            <div>👤</div>
            Профиль
        </button>

    </div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

let selectedCase = "";
let selectedIcon = "";
[16.08.2026 14:24] 𝖎𝖛𝖆𝖓𝖌𝖉𝖍𝖘: const prizes = [
    { icon: "🎁", name: "Обычный подарок" },
    { icon: "🎟️", name: "Билет" },
    { icon: "💜", name: "Purple Gift" },
    { icon: "💎", name: "Diamond Gift" },
    { icon: "👑", name: "Royal Gift" }
];

function selectCase(name, icon) {

    selectedCase = name;
    selectedIcon = icon;

    document.getElementById("home").style.display = "none";
    document.getElementById("caseScreen").style.display = "block";

    document.getElementById("caseTitle").innerText = name;
    document.getElementById("bigIcon").innerText = icon;

    document.getElementById("roulette").style.display = "none";
    document.getElementById("result").style.display = "none";

    document.getElementById("openButton").style.display = "block";
}

function goHome() {

    document.getElementById("caseScreen").style.display = "none";
    document.getElementById("home").style.display = "block";

}

function openCase() {

    const roulette = document.getElementById("roulette");
    const line = document.getElementById("rouletteLine");
    const button = document.getElementById("openButton");

    const result = document.getElementById("result");

    roulette.style.display = "block";
    result.style.display = "none";
    button.style.display = "none";

    line.innerHTML = "";

    let resultIndex = 28;

    for (let i = 0; i < 35; i++) {

        let prize = prizes[Math.floor(Math.random() * prizes.length)];

        if (i === resultIndex) {
            prize = prizes[Math.floor(Math.random() * prizes.length)];
        }

        const item = document.createElement("div");

        item.className = "item";

        item.innerHTML =
            prize.icon +
            "<span>" +
            prize.name +
            "</span>";

        line.appendChild(item);
    }

    const itemWidth = 117;

    line.style.transform = "translateX(0px)";

    setTimeout(() => {

        const randomOffset =
            (Math.random() * 30) - 15;

        const position =
            -(resultIndex * itemWidth)
            + (window.innerWidth / 2)
            - (itemWidth / 2)
            + randomOffset;

        line.style.transform =
            "translateX(" + position + "px)";

    }, 100);

    setTimeout(() => {

        const children = line.children;

        const winner =
            children[resultIndex];

        const icon =
            winner.innerText.charAt(0);

        const name =
            winner.querySelector("span").innerText;

        document.getElementById("resultIcon").innerText =
            icon;

        document.getElementById("resultName").innerText =
            name;

        result.style.display = "block";

        button.innerText = "🎁 ОТКРЫТЬ ЕЩЁ";

        button.style.display = "block";

        tg.HapticFeedback.notificationOccurred("success");

    }, 3800);

}

</script>

</body>
</html>
