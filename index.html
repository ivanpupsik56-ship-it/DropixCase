<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropix</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0d0d12;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .header {
            padding: 35px 20px 20px;
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #999;
            margin-top: 8px;
        }

        .case {
            margin: 40px auto;
            width: 280px;
            padding: 35px 20px;
            border-radius: 25px;
            background: linear-gradient(145deg, #21134b, #11111a);
            box-shadow: 0 10px 40px rgba(130, 70, 255, 0.25);
        }

        .gift {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .case-name {
            font-size: 24px;
            font-weight: bold;
        }

        .open {
            margin-top: 25px;
            width: 100%;
            padding: 16px;
            border: 0;
            border-radius: 14px;
            background: #7c3cff;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .open:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo">DROPIX</div>
        <div class="subtitle">🎁 Открывай. Получай. Забирай.</div>
    </div>

    <div class="case">
        <div class="gift">🎁</div>
        <div class="case-name">Starter Case</div>

        <button class="open" onclick="openCase()">
            ОТКРЫТЬ
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        function openCase() {
            tg.showAlert("🎁 Скоро здесь будет настоящее открытие кейса!");
        }
    </script>

</body>
</html>
