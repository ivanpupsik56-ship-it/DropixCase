<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Dropix</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    color: white;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at 50% -10%,
            #9b4dff,
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #40136b,
            #180629
        );
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    opacity: .65;

    background-image:
        radial-gradient(
            circle,
            #dcaaff 1px,
            transparent 2px
        ),
        radial-gradient(
            circle,
            #9b5cff 1px,
            transparent 2px
        );

    background-size:
        75px 75px,
        110px 110px;

    z-index: -1;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 18px 16px 100px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.logo {
    font-size: 30px;
    font-weight: 1000;
    letter-spacing: 3px;
}

.logo span {
    color: #d08aff;
}

.profile-button {
    width: 45px;
    height: 45px;
    border-radius: 50%;

    border: 2px solid #c274ff;

    background: #702cff;
    color: white;

    overflow: hidden;
    font-size: 20px;
}

.profile-button img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.balance {
    background:
        linear-gradient(
            135deg,
            rgba(73,24,112,.95),
            rgba(30,10,52,.95)
        );

    border: 1px solid #a75be0;
    border-radius: 22px;

    padding: 20px;
    margin-bottom: 25px;
}

.balance-title {
    color: #cbb7d8;
    font-size: 13px;
}

.stars {
    font-size: 28px;
    font-weight: 900;
    margin-top: 5px;
}

.section-title {
    font-size: 23px;
    font-weight: 900;
    margin-bottom: 15px;
}

.cases {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.case {
    min-height: 245px;
    padding: 15px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(62,24,91,.96),
            rgba(27,10,46,.98)
        );

    border: 1px solid #a75be0;
    border-radius: 22px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.3),
        inset 0 0 20px rgba(173,73,255,.1);
}

.chest {
    position: relative;

    width: 110px;
    height: 105px;

    margin: 5px auto 15px;

    filter:
        drop-shadow(
            0 10px 12px rgba(0,0,0,.5)
        );
}

.chest-body {
    position: absolute;

    left: 8px;
    right: 8px;
    bottom: 8px;

    height: 58px;

    border-radius:
        8px 8px 12px 12px;

    border:
        3px solid rgba(0,0,0,.3);
}

.chest-lid {
    position: absolute;

    left: 5px;
    right: 5px;
    top: 18px;

    height: 38px;

    border-radius:
        13px 13px 5px 5px;

    border:
        3px solid rgba(0,0,0,.3);
}

.chest-lock {
    position: absolute;

    width: 18px;
    height: 23px;

    left: 50%;
    top: 42px;

    transform:
        translateX(-50%);

    border-radius: 4px;

    z-index: 5;
}

.chest-wood .chest-body {
    background:
        linear-gradient(
            90deg,
            #633014,
            #b66125,
            #713412
        );
}

.chest-wood .chest-lid {
    background:
        linear-gradient(
            #d47a36,
            #773613
        );
}

.chest-wood .chest-lock {
    background: #e7b64d;
}

.chest-purple .chest-body {
    background:
        linear-gradient(
            90deg,
            #35106d,
            #8b32d5,
            #42147d
        );
}

.chest-purple .chest-lid {
    background:
        linear-gradient(
            #b64dff,
            #531798
        );
}

.chest-purple .chest-lock {
    background: #e3b9ff;

    box-shadow:
        0 0 15px #b95cff;
}

.chest-diamond .chest-body {
    background:
        linear-gradient(
            90deg,
            #0a4261,
            #16a9d3,
            #126486
        );
}

.chest-diamond .chest-lid {
    background:
        linear-gradient(
            #68eaff,
            #158bb7
        );
}

.chest-diamond .chest-lock {
    background: #d9fbff;

    box-shadow:
        0 0 18px #4be5ff;
}

.chest-royal .chest-body {
    background:
        linear-gradient(
            90deg,
            #684000,
            #d49712,
            #805200
        );
}

.chest-royal .chest-lid {
    background:
        linear-gradient(
            #ffe16a,
            #c78608
        );
}

.chest-royal .chest-lock {
    background: #fff2a5;

    box-shadow:
        0 0 20px #ffc928;
}

.case-name {
    font-size: 17px;
    font-weight: 900;
}

.case-reward {
    color: #bda8c8;

    font-size: 11px;

    min-height: 34px;

    margin: 6px 0;
}

.case button,
.admin-button {
    width: 100%;

    padding: 12px;

    border: 0;
    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #843cff,
            #b84cff
        );

    color: white;

    font-weight: 900;
}

.case button:active,
.admin-button:active {
    transform: scale(.97);
}

.history {
    margin-top: 28px;
}

.history-title {
    font-size: 19px;
    font-weight: 900;

    margin-bottom: 10px;
}

.history-item {
    display: flex;

    justify-content:
        space-between;

    padding: 12px;

    margin-bottom: 8px;

    background:
        rgba(35,15,54,.85);

    border:
        1px solid #653a7d;

    border-radius: 13px;
}

.history-item span:last-child {
    color: #ce8cff;
    font-weight: 900;
}


/* =========================
   ADMIN
========================= */

.admin-screen {
    display: none;
}

.admin-card {
    background:
        linear-gradient(
            145deg,
            rgba(67,24,95,.96),
            rgba(27,10,46,.98)
        );

    border:
        1px solid #b76cff;

    border-radius: 22px;

    padding: 20px;
}

.admin-title {
    font-size: 25px;
    font-weight: 900;

    margin-bottom: 20px;
}

.admin-input {
    width: 100%;

    padding: 14px;

    margin-top: 10px;
    margin-bottom: 10px;

    border-radius: 12px;

    border:
        1px solid #754493;

    background:
        #190d26;

    color: white;

    font-size: 15px;
}

.admin-button {
    margin-top: 8px;
}

.admin-danger {
    background:
        linear-gradient(
            135deg,
            #8d245b,
            #d02e64
        );
}

.admin-info {
    margin-top: 18px;

    padding: 15px;

    border-radius: 15px;

    background:
        #170b23;

    color:
        #cdbbd5;

    line-height: 1.6;
}

.admin-open {
    margin-top: 20px;

    display: none;
}

.back {
    margin-bottom: 20px;

    padding: 10px 14px;

    border:
        1px solid #754493;

    border-radius: 12px;

    background:
        #291238;

    color: white;
}


/* =========================
   NAV
========================= */

.nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 70px;

    background:
        rgba(22,7,35,.96);

    border-top:
        1px solid #633a79;

    display: flex;

    justify-content:
        center;
}

.nav-inner {
    width: 100%;
    max-width: 520px;

    display: flex;

    justify-content:
        space-around;

    align-items:
        center;
}

.nav button {
    background: none;
    border: 0;

    color: #95849c;

    font-size: 11px;
}

.nav button div {
    font-size: 23px;
}

</style>

</head>

<body>

<div class="container">


<!-- =========================
     ГЛАВНАЯ
========================= -->

<div id="home">

    <div class="header">

        <div class="logo">
            DROP<span>IX</span>
        </div>

        <button
            class="profile-button"
            onclick="openProfile()"
            id="profileButton"
        >
            👤
        </button>

    </div>


    <div class="balance">

        <div class="balance-title">
            Виртуальный баланс
        </div>

        <div
            class="stars"
            id="balance"
        >
            ⭐ 0
        </div>

    </div>


    <div class="section-title">
        🎁 Кейсы
    </div>


    <div class="cases">


        <!-- FREE CASE -->

        <div class="case">

            <div class="chest chest-wood">

                <div class="chest-lid"></div>

                <div class="chest-body"></div>

                <div class="chest-lock"></div>

            </div>

            <div class="case-name">
                Free Case
            </div>

            <div class="case-reward">
                Бесплатно • 1–5 ⭐
            </div>

            <button
                onclick="openCase(1,5,0,'Free Case')"
            >
                БЕСПЛАТНО
            </button>

        </div>


        <!-- PURPLE CASE -->

        <div class="case">

            <div class="chest chest-purple">

                <div class="chest-lid"></div>

                <div class="chest-body"></div>

                <div class="chest-lock"></div>

            </div>

            <div class="case-name">
                Purple Case
            </div>

            <div class="case-reward">
                25 ⭐ • 10–40 ⭐
            </div>

            <button
                onclick="openCase(10,40,25,'Purple Case')"
            >
                25 ⭐
            </button>

        </div>


        <!-- DIAMOND CASE -->

        <div class="case">

            <div class="chest chest-diamond">

                <div class="chest-lid"></div>

                <div class="chest-body"></div>

                <div class="chest-lock"></div>

            </div>

            <div class="case-name">
                Diamond Case
            </div>

            <div class="case-reward">
                100 ⭐ • 50–150 ⭐
            </div>

            <button
                onclick="openCase(50,150,100,'Diamond Case')"
            >
                100 ⭐
            </button>

        </div>


        <!-- ROYAL CASE -->

        <div class="case">

            <div class="chest chest-royal">

                <div class="chest-lid"></div>

                <div class="chest-body"></div>

                <div class="chest-lock"></div>

            </div>

            <div class="case-name">
                Royal Case
            </div>

            <div class="case-reward">
                250 ⭐ • 200–300 ⭐
            </div>

            <button
                onclick="openCase(200,300,250,'Royal Case')"
            >
                250 ⭐
            </button>

        </div>

    </div>


    <!-- ИСТОРИЯ -->

    <div class="history">

        <div class="history-title">
            📜 История
        </div>

        <div id="historyList">
            Пока открытий нет
        </div>

    </div>


    <!-- АДМИНКА -->

    <button
        class="admin-button admin-open"
        id="adminOpen"
        onclick="openAdmin()"
    >
        ⚙️ Админ-панель
    </button>

</div>



<!-- =========================
     АДМИН-ПАНЕЛЬ
========================= -->

<div
    id="adminScreen"
    class="admin-screen"
>

    <button
        class="back"
        onclick="closeAdmin()"
    >
        ← Назад
    </button>


    <div class="admin-card">

        <div class="admin-title">
            ⚙️ Админ-панель
        </div>


        <div>
            ⭐ Управление балансом
        </div>


        <input
            id="adminAmount"
            class="admin-input"
            type="number"
            placeholder="Количество звёзд"
        >


        <button
            class="admin-button"
            onclick="giveStars()"
        >
            ➕ Выдать ⭐
        </button>


        <button
            class="admin-button admin-danger"
            onclick="takeStars()"
        >
            ➖ Забрать ⭐
        </button>


        <div
            class="admin-info"
            id="adminInfo"
        ></div>

    </div>

</div>

</div>



<!-- =========================
     НИЖНЕЕ МЕНЮ
========================= -->

<div class="nav">

    <div class="nav-inner">

        <button onclick="goHome()">

            <div>
                🏠
            </div>

            Главная

        </button>


        <button onclick="goHome()">

            <div>
                🎁
            </div>

            Кейсы

        </button>


        <button onclick="openProfile()">

            <div>
                👤
            </div>

            Профиль

        </button>

    </div>

</div>



<script>

/* =========================
   TELEGRAM
========================= */

const tg =
    window.Telegram.WebApp;

tg.ready();

tg.expand();


/* =========================
   ТВОЙ ID АДМИНИСТРАТОРА
========================= */

const ADMIN_ID = 8707463948;


/* =========================
   ПОЛЬЗОВАТЕЛЬ TELEGRAM
========================= */

const user =
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user
        ? tg.initDataUnsafe.user
        : null;


/* =========================
   БАЛАНС
========================= */

let balance =
    Number(
        localStorage.getItem(
            "dropix_balance"
        )
    ) || 0;


/* =========================
   ИСТОРИЯ
========================= */

let history =
    JSON.parse(
        localStorage.getItem(
            "dropix_history"
        ) || "[]"
    );


/* =========================
   СОХРАНЕНИЕ
========================= */

function save() {

    localStorage.setItem(
        "dropix_balance",
        balance
    );

    localStorage.setItem(
        "dropix_history",
        JSON.stringify(history)
    );

}


/* =========================
   ОБНОВЛЕНИЕ БАЛАНСА
========================= */

function updateBalance() {

    document.getElementById(
        "balance"
    ).innerText =
        "⭐ " + balance;

}


/* =========================
   ОТКРЫТИЕ КЕЙСА
========================= */

function openCase(
    min,
    max,
    price,
    name
) {

    if (balance < price) {

        alert(
            "❌ Недостаточно ⭐"
        );

        return;

    }


    balance -= price;


    const reward =
        Math.floor(
            Math.random() *
            (max - min + 1)
        ) + min;


    balance += reward;


    history.unshift({

        case: name,

        reward: reward

    });


    history =
        history.slice(0,30);


    save();

    updateBalance();

    showHistory();


    alert(
        "🎉 Ты выиграл " +
        reward +
        " ⭐!"
    );

}


/* =========================
   ИСТОРИЯ
========================= */

function showHistory() {

    const list =
        document.getElementById(
            "historyList"
        );


    if (history.length === 0) {

        list.innerHTML =
            "Пока открытий нет";

        return;

    }


    list.innerHTML = "";


    history.forEach(
        item => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "history-item";


            div.innerHTML =

                "<span>" +
                item.case +
                "</span>" +

                "<span>+" +
                item.reward +
                " ⭐</span>";


            list.appendChild(div);

        }
    );

}


/* =========================
   ДОМОЙ
========================= */

function goHome() {

    document.getElementById(
        "home"
    ).style.display =
        "block";


    document.getElementById(
        "adminScreen"
    ).style.display =
        "none";


    updateBalance();

}


/* =========================
   ПРОВЕРКА АДМИНА
========================= */

function isAdmin() {

    return (

        user &&

        Number(user.id) ===
        Number(ADMIN_ID)

    );

}


/* =========================
   ПОКАЗ АДМИНКИ
========================= */

function setupAdmin() {

    const button =
        document.getElementById(
            "adminOpen"
        );


    if (isAdmin()) {

        button.style.display =
            "block";

    } else {

        button.style.display =
            "none";

    }

}


/* =========================
   ОТКРЫТЬ АДМИНКУ
========================= */

function openAdmin() {

    if (!isAdmin()) {

        alert(
            "⛔ Доступ запрещён"
        );

        return;

    }


    document.getElementById(
        "home"
    ).style.display =
        "none";


    document.getElementById(
        "adminScreen"
    ).style.display =
        "block";


    updateAdminInfo();

}


/* =========================
   ЗАКРЫТЬ АДМИНКУ
========================= */

function closeAdmin() {

    goHome();

}


/* =========================
   ИНФОРМАЦИЯ АДМИНКИ
========================= */

function updateAdminInfo() {

    document.getElementById(
        "adminInfo"
    ).innerHTML =

        "👤 Telegram ID: <b>" +

        (
            user
                ? user.id
                : "не определён"
        ) +

        "</b><br><br>" +

        "⭐ Текущий баланс: <b>" +

        balance +

        "</b>";

}


/* =========================
   ВЫДАТЬ ЗВЁЗДЫ
========================= */

function giveStars() {

    if (!isAdmin()) {

        return;

    }


    const input =
        document.getElementById(
            "adminAmount"
        );


    const amount =
        Number(input.value);


    if (
        !amount ||
        amount <= 0
    ) {

        alert(
            "Введите количество ⭐"
        );

        return;

    }


    balance += amount;


    save();

    updateBalance();

    updateAdminInfo();


    input.value = "";


    alert(
        "✅ Выдано " +
        amount +
        " ⭐"
    );

}


/* =========================
   ЗАБРАТЬ ЗВЁЗДЫ
========================= */

function takeStars() {

    if (!isAdmin()) {

        return;

    }


    const input =
        document.getElementById(
            "adminAmount"
        );


    const amount =
        Number(input.value);


    if (
        !amount ||
        amount <= 0
    ) {

        alert(
            "Введите количество ⭐"
        );

        return;

    }


    balance =
        Math.max(
            0,
            balance - amount
        );


    save();

    updateBalance();

    updateAdminInfo();


    input.value = "";


    alert(
        "✅ Забрано " +
        amount +
        " ⭐"
    );

}


/* =========================
   ПРОФИЛЬ
========================= */

function openProfile() {

    alert(

        "👤 " +

        (

            user
                ? (
                    user.first_name ||
                    "Пользователь"
                )
                : "Пользователь"

        ) +

        "\n\n⭐ Баланс: " +

        balance +

        "\n🎁 Открыто кейсов: " +

        history.length

    );

}


/* =========================
   ЗАПУСК
========================= */

updateBalance();

showHistory();

setupAdmin();

</script>

</body>
</html>
